name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: Run integration tests
        run: |
          chmod +x test/run_integration.sh
          ./test/run_integration.sh
      - name: Package
        if: success()
        run: echo "Build and test passed"
